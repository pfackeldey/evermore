[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evermore"
authors = [
    { name = "Peter Fackeldey", email = "fackeldey.peter@gmail.com" },
]
description = "Differentiable (binned) likelihoods in JAX."
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dynamic = ["version"] # version is set in src/evermore/__init__.py
dependencies = [
    "jax>=0.10.2", # jax.new_ref
    "jaxlib>=0.10.2",
    "jaxtyping>=0.3.11",
    "flax>=0.12.9",
]

[dependency-groups]
test = ["pytest >= 9", "pytest-cov >=7"]
examples = [
    "iminuit>=2.32.0", # check
    "jaxtyping>=0.3.11",
    "optax>=0.2.8",
    "optimistix>=0.1.0",
    "wadler_lindig>=0.1.7",
]
docs = [
    "sphinx>=9.1.0",
    "myst-parser>=5.1.0",
    "myst-nb>=1.4.0",
    "sphinx_copybutton>=0.5.2",
    "sphinx_autodoc_typehints>=3.13.5",
    "sphinx-book-theme>=1.4.0",
    "sphinx-design>=0.7.0",
    "sphinx-togglebutton>=0.4.5",
]
dev = [
    { include-group = "test" },
    { include-group = "examples" },
    { include-group = "docs" },
    "ipython>=9.17.0",
    "ruff>=0.16.6",
    "prek>=0.5.2",
    "ty>=0.0.79",
]

[project.urls]
Homepage = "https://github.com/pfackeldey/evermore"
"Bug Tracker" = "https://github.com/pfackeldey/evermore/issues"
Discussions = "https://github.com/pfackeldey/evermore/discussions"
Changelog = "https://github.com/pfackeldey/evermore/releases"


[tool.hatch]
version.path = "src/evermore/__init__.py"
envs.default.dependencies = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
minversion = "9"
xfail_strict = true
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
log_cli_level = "INFO"
testpaths = ["tests"]


[tool.coverage]
run.source = ["evermore"]
port.exclude_lines = ['pragma: no cover', '\.\.\.', 'if typing.TYPE_CHECKING:']


[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
strict = false
ignore_missing_imports = true


[tool.ruff.lint]
preview = true
ignore = [
    "PLR",  # Design related pylint codes
    "line-too-long", # Line too long
    # "B006",   # converts default args to 'None'
    "missing-required-import",    # isort: "from __future__ import annotations"
    "single-line-implicit-string-concatenation",  # flake8-implicit-str-concat: Implicit string concatenation"
    "import-outside-top-level", # `import` should be at the top-level of a file
    "bad-dunder-method-name", # Dunder method `...` has no special meaning in Python 3
    "used-dummy-variable",  # Local dummy variable `...` is accessed
    "forward-annotation-syntax-error",    # jaxtyping: `Float32[Array, "b c"]` (https://docs.kidger.site/jaxtyping/faq/#flake8-or-ruff-are-throwing-an-error)
]
select = [
    "E",
    "F",
    "W",    # flake8
    "B",    # flake8-bugbear
    "I",    # isort
    "C4",   # flake8-comprehensions
    "EM",   # flake8-errmsg
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "G",    # flake8-logging-format
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # Ruff-specific
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
    "EXE",  # flake8-executable
    "too-many-blank-lines", # Too many blank lines
]
unfixable = [
    "unused-variable", # Would remove unused variables
]
flake8-unused-arguments.ignore-variadic-names = true
isort.required-imports = ["from __future__ import annotations"]


[tool.ty]
# Match the original mypy scope and treat warnings as errors in pre-commit.
src.include = ["src", "tests"]
terminal.error-on-warning = true
